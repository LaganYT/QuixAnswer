<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuixAnswer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #2a2a2a;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: #00D4B5;
      border-radius: 8px;
    }

    .title {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: messageSlideIn 0.3s ease-out;
    }

    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .user-message .message-avatar {
      background: #6B46C1;
      color: #ffffff;
    }

    .ai-message .message-avatar {
      background: #00D4B5;
      color: #1a1a1a;
    }

    .message-content {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .user-message .message-content {
      background: #2a2a2a;
      color: #ffffff;
    }

    .ai-message .message-content {
      background: #252525;
      color: #e0e0e0;
    }

    .greeting {
      padding: 20px;
      font-size: 16px;
      color: #ffffff;
      font-weight: 500;
      flex-shrink: 0;
    }

    .input-container {
      padding: 20px;
      border-top: 1px solid #2a2a2a;
      flex-shrink: 0;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: #2a2a2a;
      border-radius: 8px;
      padding: 4px;
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    #input::placeholder {
      color: #666;
    }

    .send-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: #00D4B5;
      border: none;
      border-radius: 6px;
      color: #1a1a1a;
      cursor: pointer;
      transition: all 0.2s;
    }

    .send-btn:hover {
      background: #00e6c7;
      transform: scale(1.05);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Loading animation */
    .loading-dots {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .loading-dots span {
      width: 6px;
      height: 6px;
      background: #00D4B5;
      border-radius: 50%;
      animation: loadingBounce 1.4s infinite ease-in-out both;
    }

    .loading-dots span:nth-child(1) {
      animation-delay: -0.32s;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes loadingBounce {
      0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Scrollbar styling */
    #chat-container::-webkit-scrollbar {
      width: 8px;
    }

    #chat-container::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    #chat-container::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 4px;
    }

    #chat-container::-webkit-scrollbar-thumb:hover {
      background: #4a4a4a;
    }

    .setup-message {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }

    .setup-message h3 {
      margin-bottom: 12px;
      color: #00D4B5;
    }

    .setup-message p {
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .setup-message a {
      color: #00D4B5;
      text-decoration: none;
    }

    .setup-message a:hover {
      text-decoration: underline;
    }

    .setup-btn {
      background: #00D4B5;
      color: #1a1a1a;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .setup-btn:hover {
      background: #00e6c7;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#1a1a1a"/>
        <path d="M2 17L12 22L22 17M2 12L12 17L22 12" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="title">Ask away!</div>
  </div>

  <div id="chat-container">
    <div id="messages"></div>
  </div>

  <div class="greeting">
    How can I help?
  </div>

  <div class="input-container">
    <div class="input-wrapper">
      <input type="text" id="input" placeholder="Ask AI" />
      <button id="send-btn" class="send-btn">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M18 2L9 11M18 2L12 18L9 11M18 2L2 8L9 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
