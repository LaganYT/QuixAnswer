<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuixAnswer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #1a1a1a;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      display: flex;
      align-items: center;
      padding: 20px;
      border-bottom: 1px solid #2a2a2a;
      gap: 12px;
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: #00D4B5;
      border-radius: 8px;
    }

    .title {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
    }

    .history-toggle-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .history-toggle-btn:hover {
      background: #343434;
      transform: translateY(-1px);
    }

    .main-container {
      flex: 1;
      display: flex;
      min-height: 0;
      position: relative;
    }

    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .sidebar-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .chat-history-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 260px;
      background: #151515;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 1000;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    .chat-history-sidebar.open {
      transform: translateX(0);
    }

    .history-header {
      padding: 16px;
      border-bottom: 1px solid #2a2a2a;
      font-size: 12px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      margin-bottom: 4px;
      background: #1e1e1e;
      border: 1px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 13px;
      color: #ccc;
    }

    .history-item:hover {
      background: #252525;
      border-color: #3a3a3a;
    }

    .history-item.active {
      background: #2a2a2a;
      border-color: #00D4B5;
      color: #fff;
    }

    .history-item-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .history-item-delete {
      opacity: 0;
      background: transparent;
      border: none;
      color: #888;
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      transition: all 0.2s;
    }

    .history-item:hover .history-item-delete {
      opacity: 1;
    }

    .history-item-delete:hover {
      background: #3a3a3a;
      color: #ff6b6b;
    }

    .history-list::-webkit-scrollbar {
      width: 6px;
    }

    .history-list::-webkit-scrollbar-track {
      background: #151515;
    }

    .history-list::-webkit-scrollbar-thumb {
      background: #2a2a2a;
      border-radius: 3px;
    }

    .history-list::-webkit-scrollbar-thumb:hover {
      background: #3a3a3a;
    }

    .history-settings-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 14px 16px;
      background: transparent;
      border: none;
      border-top: 1px solid #2a2a2a;
      color: #888;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: auto;
    }

    .history-settings-btn:hover {
      background: #202020;
      color: #fff;
    }

    .history-settings-btn svg {
      width: 20px;
      height: 20px;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    #messages {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      animation: messageSlideIn 0.3s ease-out;
    }

    @keyframes messageSlideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .user-message .message-avatar {
      background: #6B46C1;
      color: #ffffff;
    }

    .ai-message .message-avatar {
      background: #00D4B5;
      color: #1a1a1a;
    }

    .message-content {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
    }

    .user-message .message-content {
      background: #2a2a2a;
      color: #ffffff;
    }

    .ai-message .message-content {
      background: #252525;
      color: #e0e0e0;
    }

    .greeting {
      padding: 20px;
      font-size: 16px;
      color: #ffffff;
      font-weight: 500;
      flex-shrink: 0;
    }

    .input-container {
      padding: 20px;
      border-top: 1px solid #2a2a2a;
      flex-shrink: 0;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      background: #2a2a2a;
      border-radius: 8px;
      padding: 4px;
    }

    #input {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }

    #input::placeholder {
      color: #666;
    }

    .send-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: #00D4B5;
      border: none;
      border-radius: 6px;
      color: #1a1a1a;
      cursor: pointer;
      transition: all 0.2s;
    }

    .send-btn:hover {
      background: #00e6c7;
      transform: scale(1.05);
    }

    .send-btn:active {
      transform: scale(0.95);
    }

    .send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* Loading animation */
    .loading-dots {
      display: flex;
      gap: 4px;
      padding: 8px 0;
    }

    .loading-dots span {
      width: 6px;
      height: 6px;
      background: #00D4B5;
      border-radius: 50%;
      animation: loadingBounce 1.4s infinite ease-in-out both;
    }

    .loading-dots span:nth-child(1) {
      animation-delay: -0.32s;
    }

    .loading-dots span:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes loadingBounce {
      0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.5;
      }
      40% {
        transform: scale(1);
        opacity: 1;
      }
    }

    /* Scrollbar styling */
    #chat-container::-webkit-scrollbar {
      width: 8px;
    }

    #chat-container::-webkit-scrollbar-track {
      background: #1a1a1a;
    }

    #chat-container::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 4px;
    }

    #chat-container::-webkit-scrollbar-thumb:hover {
      background: #4a4a4a;
    }

    .setup-message {
      text-align: center;
      padding: 40px 20px;
      color: #888;
    }

    .setup-message h3 {
      margin-bottom: 12px;
      color: #00D4B5;
    }

    .setup-message p {
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .setup-message a {
      color: #00D4B5;
      text-decoration: none;
    }

    .setup-message a:hover {
      text-decoration: underline;
    }

    .setup-btn {
      background: #00D4B5;
      color: #1a1a1a;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .setup-btn:hover {
      background: #00e6c7;
      transform: translateY(-1px);
    }

    /* Delete confirmation modal */
    .delete-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .delete-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .delete-modal {
      background: #2a2a2a;
      border: 1px solid #3a3a3a;
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      transform: scale(0.9);
      transition: transform 0.2s ease;
    }

    .delete-modal-overlay.active .delete-modal {
      transform: scale(1);
    }

    .delete-modal-header {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 12px;
    }

    .delete-modal-message {
      font-size: 14px;
      color: #ccc;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .delete-modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-btn-cancel {
      background: #3a3a3a;
      color: #fff;
    }

    .modal-btn-cancel:hover {
      background: #4a4a4a;
    }

    .modal-btn-delete {
      background: #ff6b6b;
      color: #fff;
    }

    .modal-btn-delete:hover {
      background: #ff5252;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#1a1a1a"/>
        <path d="M2 17L12 22L22 17M2 12L12 17L22 12" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="title">Ask away!</div>
    <button id="new-chat-btn" class="send-btn" title="Start new chat">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <button id="history-toggle-btn" class="history-toggle-btn" title="Chat history">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 6H17M3 10H17M3 14H17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <!-- Sidebar overlay backdrop -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Chat history sidebar (slide-out drawer) -->
  <aside class="chat-history-sidebar" id="chat-history-sidebar">

    <div class="history-list" id="history-list"></div>

12.0005 16.2892 12.2094 16.1826 12.4558V12.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>Settings</span>
    </button>
  </aside>

  <!-- Delete confirmation modal -->
  <div class="delete-modal-overlay" id="delete-modal-overlay">
    <div class="delete-modal">
      <div class="delete-modal-header">Delete Chat?</div>
      <div class="delete-modal-message">This will permanently delete this conversation. This action cannot be undone.</div>
      <div class="delete-modal-actions">
        <button class="modal-btn modal-btn-cancel" id="delete-cancel-btn">Cancel</button>
        <button class="modal-btn modal-btn-delete" id="delete-confirm-btn">Delete</button>
      </div>
    </div>
  </div>

  <div class="main-container">
    <div id="chat-container">
      <div id="messages"></div>
    </div>
  </div>

  <div class="input-container">
    <div class="input-wrapper">
      <input type="text" id="input" placeholder="Ask AI" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
      <button id="send-btn" class="send-btn">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M18 2L9 11M18 2L12 18L9 11M18 2L2 8L9 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
